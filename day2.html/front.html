<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSIGNMENT</title>
    
</head>
<body>
    <h1>HTML Form Page </h1>
    
    <form action="">
        <lable for="">Enter Your Full Name : </lable> 
        <br>
        <input type="text" placeholder="Full Name">
        <br>
        <lable for="">Enter  Your Email ID :</lable>
        <br>
        <input type="email" placeholder="Email Id">
        <br>
        <label for="">Enter Your Password :</label>
        <br>
        <input type="password" placeholder="Password">
        <br>
        <lable for=""> Confirm Your Password :</lable>
        <br>
        <input type="password"placeholder="Confirm Password">
        <br>
        <lable for="">Enter Your Gender :</lable>
        <br>
        <input type="radio" name="gender" value="Male">
        <label for="">Male</label>
        <input type="radio" name="gender" value="Female">
        <lable for="">Female</lable>
        <input type="radio" name="gender" value="Other">
        <label for="">Other</label>
        <br>
        <lable for="">Enter Your Date of Birth :</lable>
        <br>
        <input type="date" placeholder="DD-MM-YYYY">
        <br>
        <label for="">Enter Your Address</label>
        <br>
        <textarea placeholder="Address"></textarea>
        <br>
        <button>submit</button>

    </form>
    
</body>
</html>
